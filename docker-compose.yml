services:
  cgate:
    build:
      context: .
      args:
        # C-Gate distribution bundled into the image. Must match a
        # directory named "C-Gate Downloads/cgate-<version>/".
        # Override via a CGATE_VERSION env var or a .env file.
        CGATE_VERSION: ${CGATE_VERSION:-3.8.0_2348}
    image: cgate-server:latest
    container_name: cgate-server
    restart: unless-stopped
    ports:
      # Command Interface
      - "20023:20023"
      # Event Interface
      - "20024:20024"
      # Status Change Port
      - "20025:20025"
      # Config Change Port
      - "20026:20026"
      # SSL Command Interface
      - "20123:20123"
      # SSL Event Interface
      - "20124:20124"
      # SSL Status Change Port
      - "20125:20125"
      # SSL Config Change Port
      - "20126:20126"
      # Web Console / HTTP Commander
      - "8980:8980"
    volumes:
      - ./config:/cgate/config
      - ./tag:/cgate/tag
      - ./C-Gate-Native-Logs:/cgate/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "cgate-server"
